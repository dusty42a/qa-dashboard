<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>QA Dashboard</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>QA Dashboard</h1>
                <p class="muted">Pick a target version.</p>
            </div>
            <img src="/static/wb_logo.png" alt="Workbooks" class="header-logo">
        </div>
    </header>

    <main>
        <p id="status" class="muted">Loading versions…</p>

        <section id="featured" class="featured" hidden>
            <div class="featured-card current" id="featured-current" hidden>
                <span class="featured-label">Current release</span>
                <a class="featured-name" href="#"></a>
                <span class="featured-meta muted"></span>
            </div>
            <div class="featured-card previous" id="featured-previous" hidden>
                <span class="featured-label">Previous release</span>
                <a class="featured-name" href="#"></a>
                <span class="featured-meta muted"></span>
            </div>
        </section>

        <div id="patch-queue-section" class="patch-queue-section" hidden>
            <div class="patch-queue-header">
                <div>
                    <span class="featured-label">Patch Queue</span>
                    <a class="patch-queue-name featured-name" href="#"></a>
                </div>
                <div class="patch-queue-header-right">
                    <span class="patch-queue-meta featured-meta muted"></span>
                    <span class="patch-queue-count issue-count-badge"></span>
                </div>
            </div>
            <ul class="patch-queue-issues"></ul>
        </div>

        <h2 class="all-versions-heading" id="all-heading" hidden>All versions</h2>
        <div id="version-groups"></div>
    </main>

    <footer>
        <span id="last-fetched" class="muted"></span>
    </footer>

    <script src="/static/landing.js"></script>
</body>
</html>
